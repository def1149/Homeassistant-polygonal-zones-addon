name: "Polygonal Zones"
description: "Helper Add-on for the polygonal zones integration."
version: "0.4.0"
slug: "polygonal_zones"
url: "https://github.com/MatthewHobbs/Homeassistant-polygonal-zones-addon/tree/main/polygonal_zones_editor"
# Image integrity: published images carry a Sigstore build-provenance
# attestation generated by .github/workflows/release.yml (keyless, via
# GitHub OIDC). Verify with:
#   gh attestation verify oci://ghcr.io/matthewhobbs/<arch>-addon-polygonal_zones:<version> --owner MatthewHobbs
# The Supervisor `codenotary:` verification key is intentionally NOT set —
# CodeNotary CAS is discontinued and the key was removed/deprecated in
# Home Assistant 2026.x. Provenance attestation is the supported path.
panel_icon: "mdi:map"
# Pre-built images published by .github/workflows/release.yml on each
# v* tag. Supervisor pulls instead of building locally — much faster
# updates on slow ARM hardware.
image: "ghcr.io/def1149/{arch}-addon-polygonal_zones"

init: false
arch:
  - aarch64
  - amd64
# The addon only serves data that the polygonal-zones integration polls from
# Home Assistant Core, so it belongs in the `services` tier rather than
# `system`. `system` is for DNS / Supervisor-level services that must come up
# before Core.
startup: services
ingress: true
ingress_port: 8000
# TCP 8000 is declared but unmapped by default. Users who want direct LAN
# access (e.g. for `curl`-based backups or running the companion integration
# in a separate container) opt in via Supervisor -> Network -> set a host
# port. Default ingress-only is the safer posture; pair with save_token
# whenever the port is exposed.
ports:
  8000/tcp: null

# Read-only access to Home Assistant's state API, used by /trackers.json to
# plot live tracker positions over the map. Only entities named in
# `overlay_entities` are ever requested, and that list is empty by default —
# with it empty the add-on asks Home Assistant for nothing at all.
homeassistant_api: true

options:
  allow_all_ips: false
  overlay_entities: []
  zone_colour: purple
  trusted_proxies: ""
  log_level: info
  save_token: ""
  theme: auto
schema:
  allow_all_ips: bool
  # Entity ids to plot on the map (e.g. device_tracker.my_car). Empty by
  # default: nothing is fetched or displayed until you name something here.
  # These positions are returned by /trackers.json, which is reachable on your
  # LAN whenever allow_all_ips is on — so list only what you are content to
  # expose there, and prefer vehicles over people.
  overlay_entities:
    - str?
  # Accept CSS colour names (letters only) or hex values of 3/4/6/8 hex
  # digits. Tightening this prevents Supervisor from accepting empty
  # strings or rgb()/hsl() function notation that neither the backend nor
  # Leaflet is equipped to handle.
  zone_colour: match(^#[0-9a-fA-F]{3,8}$|^[a-zA-Z]+$)
  trusted_proxies: str?
  log_level: list(debug|info|warning|error|critical)?
  save_token: password?
  theme: list(auto|light|dark)?
